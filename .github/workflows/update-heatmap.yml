name: Update Data

on:
  push:
    paths:
      - 'posts/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 装 Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 生成数据
        run: node build-data.js

      - name: 提交更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/heatmap.json data/posts.json
          git diff --staged --quiet || git commit -m "chore: 更新数据 [skip ci]"
          git push
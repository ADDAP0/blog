<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>更新日志 · 米饭多加水の小窝</title>

  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/background.css">
  <link rel="stylesheet" href="css/navbar.css">
  <link rel="stylesheet" href="css/cards.css">
  <link rel="stylesheet" href="css/footer.css">
  <link rel="stylesheet" href="css/changelog.css">

  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0" />
</head>
<body>

  <!-- 背景 -->
  <div class="slideshow" id="slideshow"></div>
  <div class="overlay"></div>

  <!-- 导航栏（简化版，跟首页一致的样式） -->
  <nav class="navbar">
    <div class="nav-brand-wrap">
      <a href="index.html" class="nav-brand">
        <span class="brand-text">米饭多加水の小窝</span>
      </a>
    </div>

    <ul class="nav-menu">
      <li class="nav-li">
        <a href="index.html" class="nav-item">
          <span class="material-symbols-rounded">home</span>主页
        </a>
      </li>
      <li class="nav-li">
        <a href="changelog.html" class="nav-item active">
          <span class="material-symbols-rounded">update</span>更新日志
        </a>
      </li>
    </ul>
  </nav>

  <!-- 主区 -->
  <main class="changelog-page">
    <header class="page-header">
      <h1 class="page-title">更新日志</h1>
      <p class="page-sub">记录这个博客的每一次变化</p>
    </header>

    <div class="timeline" id="timeline">
      <!-- JS 动态渲染 -->
      <div class="loading">加载中…</div>
    </div>
  </main>

  <!-- 底部条 -->
  <div class="footer-bar" style="max-width:1100px;margin:24px auto 40px;">
    <div class="clock" id="clock">--:--:--</div>
    <div class="status">
      <span class="dot-green"></span>
      <span>持续更新中</span>
    </div>
    <div class="icp" style="margin-left:auto;">萌ICP备20260240号</div>
  </div>

  <script src="js/slideshow.js"></script>
  <script src="js/clock.js"></script>
  <script src="js/changelog.js"></script>
</body>
</html>
